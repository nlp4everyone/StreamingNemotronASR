services:
  asr-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: streaming-nemotron-asr:latest
    container_name: streaming-nemotron-asr
    ports:
      - "${APP_PORT:-8010}:8000"

    # ── Streaming preset & behaviour ─────────────────────────────────────────
    # Override any setting via env without rebuilding.
    # Full list: see config/settings.yaml
    environment:
      ASR_STREAMING_PRESET: balanced   # ultra_low | low | medium | balanced | high
      ASR_BATCH_MODE: per_session      # per_session | dynamic
      ASR_MAX_SESSIONS: "50"
      ASR_DEVICE: cuda
      ASR_DEFAULT_LANG: auto
      ASR_END_OF_SPEECH_TIMEOUT_S: "3.0"
      ASR_THREAD_POOL_WORKERS: "4"

    # ── Volumes ───────────────────────────────────────────────────────────────
    # hf-cache: HuggingFace model weights (persisted across restarts)
    # nemo-cache: NeMo intermediate files
    volumes:
      - hf-cache:/cache/huggingface
      - nemo-cache:/cache/nemo

    # ── GPU ───────────────────────────────────────────────────────────────────
    # runtime: nvidia — explicit nvidia runtime; works even when deploy section
    # is ignored (e.g. docker compose run, older Compose versions without Swarm).
    # Requires nvidia-container-toolkit + `sudo nvidia-ctk runtime configure --runtime=docker`.
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s    # Dockerfile.cuda: longer cold-start (NeMo init + HF download)

# ── Named volumes (data persists across `docker compose down`) ────────────────
volumes:
  hf-cache:
  nemo-cache:
