# ── Streaming preset ─────────────────────────────────────────────────────────
# ultra_low : att_context=[56,0]  · chunk= 80ms ·  4 packets/chunk
# low       : att_context=[56,1]  · chunk=160ms ·  8 packets/chunk
# medium    : att_context=[56,3]  · chunk=320ms · 16 packets/chunk
# balanced  : att_context=[56,6]  · chunk=560ms · 28 packets/chunk  ← default
# high      : att_context=[56,13] · chunk=1120ms· 56 packets/chunk
#
# Override via env:  ASR_STREAMING_PRESET=high
# Override locally:  create config/settings.local.yaml (gitignored)
streaming_preset: balanced

# ── Batch inference ───────────────────────────────────────────────────────────
# per_session: immediate inference per session (simple, lowest added latency)
# dynamic    : collect up to max_batch_size sessions within batch_timeout_ms,
#              then dispatch as one GPU call. Switch when sessions > 100 and
#              GPU utilisation is below 50%.
batch_mode: dynamic
max_batch_size: 32
batch_timeout_ms: 30

# ── Server ────────────────────────────────────────────────────────────────────
host: "0.0.0.0"
port: 8000
max_sessions: 200

# ── Model ─────────────────────────────────────────────────────────────────────
model_name: "nvidia/nemotron-3.5-asr-streaming-0.6b"
device: "cuda"
default_lang: "auto"
# Number of independent model instances in the pool.
# pool_size=1: safe on all GPUs, serializes all CUDA ops (no concurrent kernel conflict).
# pool_size=2: doubles GPU throughput but requires per-instance CUDA stream isolation
#              to avoid illegal memory access from concurrent CUDA kernels. Set only
#              after confirming GPU has >= 3 GB free VRAM beyond session caches.
model_pool_size: 1

# ── Behaviour ─────────────────────────────────────────────────────────────────
end_of_speech_timeout_s: 3.0
# Non-final chunks are dropped when a session already has this many requests
# in-flight. 1=strictest (sequential), 2=one batch_timeout of buffer.
max_pending_per_session: 2
# Idle session cleanup (ghost sessions — TCP alive but no audio).
# Dead TCP connections are handled by uvicorn ws-ping-interval=20 ws-ping-timeout=30.
idle_timeout_s: 60.0
session_sweep_interval_s: 30.0
# With pool_size=1 only one _batch_infer runs at a time; 2 workers allows the
# second thread to preprocess (CPU) while the first holds the pool lock.
thread_pool_workers: 2
